#
# Latch — SIEM onboarding and assurance taxonomy reference app.
#
# This app is entirely self-contained: the taxonomy, source catalogue,
# logging pattern and health-check reference data are bundled with the app
# as static assets, and the frontend performs no outbound network calls. No
# credentials, indexes, or configuration are required to use it.
#
# is_configured is false, as AppInspect requires for a shipped package
# (check_that_setup_has_not_been_performed): a package must never ship
# pre-marked as already configured. The app has no setup_view, so this has
# no user-visible effect — there is nothing to complete a setup wizard for.
#

[install]
is_configured = false
state = enabled

[ui]
is_visible = true
label = Latch

[launcher]
author = adamliq
description = Browse the LATCH SIEM onboarding taxonomy, source catalogue, logging patterns and health checks.
version = 1.0.0

[id]
name = latch
version = 1.0.0

[package]
id = latch
check_for_updates = true
